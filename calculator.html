<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gismeteo - Калькулятор</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="calculator-page"> 
    <div class="header">
        <div class="header-content">
            <h1 class="logo"> 
                <a href="gismetio.html" style="text-decoration: none; color: inherit;">
                    <span class="logo-gis">GIS</span><span class="logo-meteo">meteo</span>
                </a>
            </h1>
            <div class="nav-buttons">
                <a href="calculator.html" class="nav-button">Калькулятор</a>
                <a href="about.html" class="nav-button">Об авторе</a>
            </div>
        </div>
    </div>
    
    <div class="main">
        <div class="content-card">
            <div id="result" class="result">0</div>
            
            <div class="buttons-container">
                <div class="button-row">  
                    <button class="my-btn secondary">C</button>
                    <button class="my-btn secondary">+/-</button>
                    <button class="my-btn secondary">%</button>
                    <button class="my-btn primary">/</button>
                </div>
                <div class="button-row">
                    <button class="my-btn">7</button>
                    <button class="my-btn">8</button>
                    <button class="my-btn">9</button>
                    <button class="my-btn primary">×</button>
                </div>
                <div class="button-row">
                    <button class="my-btn">4</button>
                    <button class="my-btn">5</button>
                    <button class="my-btn">6</button>
                    <button class="my-btn primary">−</button>
                </div>
                <div class="button-row">
                    <button class="my-btn">1</button>
                    <button class="my-btn">2</button>
                    <button class="my-btn">3</button>
                    <button class="my-btn primary">+</button>
                </div>
                <div class="button-row last-row">
                    <button class="my-btn">0</button>
                    <button class="my-btn">.</button>
                    <button class="my-btn primary execute">=</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        © 2001–2026 Gismeteo · Калькулятор
    </div>
</body>
</html>
