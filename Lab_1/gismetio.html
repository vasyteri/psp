<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gismeteo — погода в России и мире</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1 class="logo">
                <a href="gismetio.html" style="text-decoration: none; color: inherit;">Gismeteo</a>
            </h1>
            <div class="nav-buttons">
                <a href="calculator.html" class="nav-button">Калькулятор</a>
                <a href="about.html" class="nav-button">Об авторе</a>
            </div>
        </div>
    </div>
    
    <div class="main">
        <div class="content-card">
            <div class="weather-card">
                <h2>Москва</h2>
                <div class="weather-now">
                    <div class="temp-now">+5°</div>
                    <div class="weather-details">
                        <div>🌬️ Ветер: 5 м/с</div>
                        <div>💧 Влажность: 70%</div>
                        <div>☁️ Облачно</div>
                    </div>
                </div>
                <p style="color: #555; font-size: 0.9rem; margin-top: 1rem;">
                    <strong>Температура воздуха, °C</strong> · <strong>Порывы ветра, м/c</strong>
                </p>
            </div>

            <h3>Прогноз на неделю</h3>
            <div class="forecast">
                <div class="forecast-day">Пн<br>+3°</div>
                <div class="forecast-day">Вт<br>+4°</div>
                <div class="forecast-day">Ср<br>+6°</div>
                <div class="forecast-day">Чт<br>+5°</div>
                <div class="forecast-day">Пт<br>+4°</div>
            </div>
        </div>
    </div>
    
    <!-- Подвал -->
    <div class="footer">
        © 2001–2025 Gismeteo · Все права защищены
    </div>
</body>
</html>
